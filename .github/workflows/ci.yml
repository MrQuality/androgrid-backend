name: Rust CI & Section 8 BDD Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    name: Verify, Test & Acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Static Analysis (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Execute Unit and Property Tests
        run: cargo test --all-targets

      - name: Verify Section 8 Gherkin BDD Acceptance Suite
        run: cargo test --test bdd_acceptance_spec

      - name: Verify Automated Hardware Cluster Smoke Test Runner
        run: |
          python3 -m unittest discover -s tests -p "test_smoke_runner.py"
          python3 tools/smoke/test_hardware_cluster.py --dry-run

      - name: Audit Typographic Standards (Zero Em/En Dashes)
        run: |
          echo "Scanning for forbidden em dashes and en dashes..."
          if grep -rnP '[\x{2013}\x{2014}]' src/ tests/ proto/ deploy/ tools/ docs/; then
            echo "Error: Forbidden em dash or en dash detected!"
            exit 1
          fi
          echo "Typographic audit passed: 0 em/en dashes found."
