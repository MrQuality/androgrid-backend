[package]
name = "androgrid-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "High-concurrency Rust control plane for distributed mobile edge computing."

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = "0.13"
prost-types = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
axum = "0.7"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
pem = "3.0"


[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
prost-build = "0.13"
protoc-bin-vendored = "3.3"

[dev-dependencies]
proptest = "1.5"
tokio-test = "0.4"
tokio-stream = { version = "0.1", features = ["net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }


[[bin]]
name = "androgrid-backend"
path = "src/main.rs"

[[bin]]
name = "androgrid-cli"
path = "src/bin/androgrid_cli.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

