[book]
authors = ["AndroGrid Authors"]
language = "en"
multilingual = false
src = "src"
title = "AndroGrid Documentation"
description = "Public Documentation Portal and Technical Reference for the AndroGrid Distributed Edge Cluster"

[output.html]
git-repository-url = "https://github.com/MrQuality/androgrid-backend"
edit-url-template = "https://github.com/MrQuality/androgrid-backend/edit/main/docs/{path}"
default-theme = "rust"
preferred-dark-theme = "coal"
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
