name: Deploy Documentation Portal to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: "0.4.40"

      - name: Setup Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-doc
        run: |
          PROTOC_GEN_DOC_VERSION="1.5.1"
          curl -sSL "https://github.com/pseudomuto/protoc-gen-doc/releases/download/v${PROTOC_GEN_DOC_VERSION}/protoc-gen-doc_${PROTOC_GEN_DOC_VERSION}_linux_amd64.tar.gz" | tar -xz
          sudo mv protoc-gen-doc /usr/local/bin/
          chmod +x /usr/local/bin/protoc-gen-doc

      - name: Generate Protobuf HTML API Reference
        run: |
          mkdir -p docs/src/api/generated
          protoc --doc_out=docs/src/api/generated --doc_opt=html,index.html -I proto proto/androgrid/v1/orchestrator.proto
          # Sanitize any upstream protobuf scalar type en/em dashes
          python3 -c "
          import pathlib
          p = pathlib.Path('docs/src/api/generated/index.html')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = text.replace('\u2013', '-').replace('\u2014', '-')
              p.write_text(text, encoding='utf-8')
          "

      - name: Audit Typographic Standards (Zero Em/En Dashes)
        run: |
          echo "Scanning documentation for forbidden em dashes and en dashes..."
          if grep -rnP '[\x{2013}\x{2014}]' docs/; then
            echo "Error: Forbidden em dash or en dash detected in docs/!"
            exit 1
          fi
          echo "Typographic audit passed: 0 em/en dashes found."

      - name: Build mdBook Site
        run: |
          mdbook build docs

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
