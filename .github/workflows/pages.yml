name: Deploy Documentation Portal to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-doc
        run: |
          PROTOC_GEN_DOC_VERSION="1.5.1"
          curl -sSL "https://github.com/pseudomuto/protoc-gen-doc/releases/download/v${PROTOC_GEN_DOC_VERSION}/protoc-gen-doc_${PROTOC_GEN_DOC_VERSION}_linux_amd64.tar.gz" | tar -xz
          sudo mv protoc-gen-doc /usr/local/bin/
          chmod +x /usr/local/bin/protoc-gen-doc

      - name: Generate Protobuf HTML API Reference
        run: |
          mkdir -p docs/src/api/generated
          protoc --doc_out=docs/src/api/generated --doc_opt=html,index.html -I proto proto/androgrid/v1/orchestrator.proto

      - name: Audit Typographic Standards (Zero Em/En Dashes)
        run: |
          echo "Scanning documentation for forbidden em dashes and en dashes..."
          if grep -rnP '[\x{2013}\x{2014}]' docs/; then
            echo "Error: Forbidden em dash or en dash detected in docs/!"
            exit 1
          fi
          echo "Typographic audit passed: 0 em/en dashes found."

      - name: Build mdBook Site
        run: |
          mdbook build docs

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
