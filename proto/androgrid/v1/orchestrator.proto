syntax = "proto3";

package androgrid.v1;

option java_package = "com.androgrid.v1";
option java_multiple_files = true;

// AndroGridService provides cluster orchestration between the Host Control Plane
// and distributed Android Worker Nodes.
// Traces to: [REQ-OP-001], [REQ-OP-002], [REQ-OP-003], [REQ-OP-004]
service AndroGridService {
  // Wi-Fi Persistent Declarative Loop
  // Traces to: [REQ-OP-001]
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Traces to: [REQ-OP-002]
  rpc SyncNodeState(SyncNodeStateRequest) returns (SyncNodeStateResponse);

  // Cellular Disconnected Unary Surface (Zero-Keepalive)
  // Traces to: [REQ-OP-003], [INV-003], [NFR-POW-001]
  rpc ClaimCellularTask(ClaimCellularTaskRequest) returns (ClaimCellularTaskResponse);

  // Traces to: [REQ-OP-004], [INV-004], [NFR-REL-001]
  rpc SubmitCellularResult(SubmitCellularResultRequest) returns (SubmitCellularResultResponse);

  // Content-addressed WASM artifact retrieval over the authenticated mTLS 1.3 channel.
  // Traces to: [INV-002], [NFR-PERF-001], [NFR-POW-001], [REQ-OP-003]
  rpc FetchArtifact(FetchArtifactRequest) returns (FetchArtifactResponse);
}

// AdminService provides administrative control, task submission, and cluster observability
// for human operators and external pipeline automation.
// Traces to: [REQ-OP-001], [REQ-OP-004], [INV-002], [NFR-SEC-001]
service AdminService {
  // Enqueue a compute task into the cluster scheduling queue.
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);

  // Retrieve current execution status, exit code, and outputs for a task.
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);

  // List all registered worker nodes, their hardware capabilities, and connection states.
  rpc ListWorkerNodes(ListWorkerNodesRequest) returns (ListWorkerNodesResponse);

  // Cancel an active or pending task.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // Upload or register a WebAssembly bytecode artifact for content-addressed distribution.
  // Traces to: [NFR-PERF-001], [NFR-POW-001], [REQ-OP-003]
  rpc UploadArtifact(UploadArtifactRequest) returns (UploadArtifactResponse);

  // Generate an ephemeral device pairing token for mobile node onboarding.
  // Traces to: [INV-002], [NFR-SEC-001], [REQ-OP-001]
  rpc GeneratePairingToken(GeneratePairingTokenRequest) returns (GeneratePairingTokenResponse);

  // List all known compute tasks and their lifecycle execution states.
  // Traces to: [REQ-OP-004], [INV-004], [INV-005]
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // Submit a partitioned TaskGroup workload using a shared content-addressed template.
  // Traces to: [REQ-OP-004], [INV-004], [INV-006], [NFR-PERF-001]
  rpc SubmitTaskGroup(SubmitTaskGroupRequest) returns (SubmitTaskGroupResponse);

  // Atomically replace a TaskGroup workload with a new epoch and rollout strategy.
  // Traces to: [INV-004], [NFR-REL-001], [NFR-PERF-001]
  rpc ReplaceTaskGroup(ReplaceTaskGroupRequest) returns (ReplaceTaskGroupResponse);

  // Cancel a TaskGroup and all of its non-terminal tasks.
  // Traces to: [REQ-OP-004], [INV-004]
  rpc CancelTaskGroup(CancelTaskGroupRequest) returns (CancelTaskGroupResponse);

  // Retrieve aggregate status and optional per-partition details for a TaskGroup.
  // Traces to: [REQ-OP-004], [NFR-PERF-001]
  rpc GetTaskGroupStatus(GetTaskGroupStatusRequest) returns (GetTaskGroupStatusResponse);

  // List all registered TaskGroups and their current epoch summaries.
  // Traces to: [REQ-OP-004]
  rpc ListTaskGroups(ListTaskGroupsRequest) returns (ListTaskGroupsResponse);
}

// EnrollmentService provides bootstrap enrollment for unprovisioned worker nodes.
// Traces to: [INV-002], [NFR-SEC-001], [REQ-OP-001]
service EnrollmentService {
  // Exchange an ephemeral pairing token and PKCS#10 CSR for a signed mTLS client certificate.
  rpc EnrollWorker(EnrollWorkerRequest) returns (EnrollWorkerResponse);
}


// Active network interface type reported by worker node.
enum NetworkTransportType {
  NETWORK_TRANSPORT_UNSPECIFIED = 0;
  NETWORK_TRANSPORT_WIFI_LAN = 1;
  NETWORK_TRANSPORT_CELLULAR_WAN = 2;
}

// Supported compute execution sandbox runtime on client device.
// Traces to: [INV-006]
enum ExecutionEngine {
  EXECUTION_ENGINE_UNSPECIFIED = 0;
  EXECUTION_ENGINE_WASM_WASI = 1;
  EXECUTION_ENGINE_ROOT_SHELL = 2 [deprecated = true];
  EXECUTION_ENGINE_TOYBOX_USER = 3;
}

// Task execution lifecycle states.
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_LEASED = 2;
  TASK_STATE_RUNNING = 3;
  TASK_STATE_COMPLETED = 4;
  TASK_STATE_FAILED = 5;
  TASK_STATE_PREEMPTED = 6;
  TASK_STATE_TIMED_OUT = 7;
  TASK_STATE_CANCELLED = 8;
}

// Lifecycle states for a coordinated TaskGroup workload.
// Traces to: [REQ-OP-004], [INV-004], [NFR-REL-001]
enum TaskGroupState {
  TASK_GROUP_STATE_UNSPECIFIED = 0;
  TASK_GROUP_STATE_ACTIVE = 1;
  TASK_GROUP_STATE_DRAINING = 2;
  TASK_GROUP_STATE_COMPLETED = 3;
  TASK_GROUP_STATE_FAILED = 4;
  TASK_GROUP_STATE_CANCELLED = 5;
}

// Rollout strategy when atomically replacing a TaskGroup epoch.
// Traces to: [INV-004], [NFR-REL-001]
enum ReplaceStrategy {
  REPLACE_STRATEGY_UNSPECIFIED = 0;
  REPLACE_STRATEGY_IMMEDIATE = 1;
  REPLACE_STRATEGY_DRAIN = 2;
}

// Hardware and platform capabilities reported by worker node.
// Traces to: [REQ-VER-002], [INV-006], [REQ-OP-003]
message NodeCapabilities {
  bool is_rooted = 1;
  repeated ExecutionEngine supported_engines = 2;
  uint32 cpu_cores = 3;
  uint64 total_ram_bytes = 4;
  string os_version = 5;
  string abi = 6;
  bool is_metered = 7;
  NetworkTransportType current_transport = 8;
  uint32 max_cellular_task_duration_seconds = 9; // Max duration constraint (e.g., 180s per [INV-005])
  int32 battery_temperature_celsius = 10;
  uint32 thermal_status = 11; // Maps to Android PowerManager.THERMAL_STATUS_*
}

// Execution specification for an assigned compute task.
// Traces to: [INV-004], [INV-005], [NFR-PERF-001]
message TaskSpec {
  string task_id = 1;
  uint32 run_attempt = 2;
  ExecutionEngine engine = 3;
  uint32 timeout_seconds = 4;
  string entrypoint = 5;
  map<string, string> env_vars = 6;
  bytes wasm_bytecode = 7;
  string shell_command = 8;
  string artifact_sha256 = 9;
  bool requires_unmetered = 10;
  // Deprecated: workers resolve content-addressed artifacts via FetchArtifact over mTLS 50051.
  string artifact_url = 11 [deprecated = true];
  string group_id = 12;
  uint64 group_epoch = 13;
}

// Unary request to claim a spot task over cellular WAN.
// Traces to: [REQ-OP-003], [INV-003]
message ClaimCellularTaskRequest {
  string node_id = 1;
  NodeCapabilities capabilities = 2;
  uint32 battery_level_pct = 3;
  bool is_charging = 4;
  int32 battery_temperature_celsius = 5;
  uint32 thermal_status = 6; // Maps to Android PowerManager.THERMAL_STATUS_*
}

// Response granting a cellular spot lease.
// Traces to: [REQ-OP-003], [INV-005]
message ClaimCellularTaskResponse {
  bool task_available = 1;
  TaskSpec task = 2;
  uint32 deadline_epoch_seconds = 3;
}

// Atomic result submission with monotonic run_attempt.
// Traces to: [REQ-OP-004], [INV-004]
message SubmitCellularResultRequest {
  string node_id = 1;
  string task_id = 2;
  uint32 run_attempt = 3;
  int32 exit_code = 4;
  bytes stdout_bytes = 5;
  bytes stderr_bytes = 6;
  string error_code = 7;
  string error_message = 8;
  uint64 execution_duration_ms = 9;
}

// Orchestrator response to atomic result submission.
message SubmitCellularResultResponse {
  bool accepted = 1;
  string status_message = 2;
}

// Initial node registration over local Wi-Fi.
// Traces to: [REQ-OP-001]
message RegisterNodeRequest {
  string node_id = 1;
  NodeCapabilities capabilities = 2;
  string client_version = 3;
}

// Registration lease response.
message RegisterNodeResponse {
  string session_token = 1;
  uint32 heartbeat_interval_seconds = 2;
  uint32 lease_timeout_seconds = 3;
}

// Status report for an active or completed task.
message TaskExecutionReport {
  string task_id = 1;
  uint32 run_attempt = 2;
  TaskState state = 3;
  int32 exit_code = 4;
  bytes stdout_bytes = 5;
  bytes stderr_bytes = 6;
  string error_code = 7;
  uint64 execution_time_ms = 8;
}

// Periodic declarative state synchronization over Wi-Fi.
// Traces to: [REQ-OP-002]
message SyncNodeStateRequest {
  string node_id = 1;
  string session_token = 2;
  repeated TaskExecutionReport active_tasks = 3;
  repeated TaskExecutionReport completed_tasks = 4;
}

// Orchestrator response with desired tasks and acknowledgments.
message SyncNodeStateResponse {
  uint64 server_epoch_ms = 1;
  repeated TaskSpec desired_tasks = 2;
  repeated string cancel_task_ids = 3;
  repeated string acknowledged_task_ids = 4;
}


// Request to enqueue a compute task.
message SubmitTaskRequest {
  TaskSpec task = 1;
}

// Response acknowledging task submission.
message SubmitTaskResponse {
  bool accepted = 1;
  string task_id = 2;
  string message = 3;
}

// Request for task execution status.
message GetTaskStatusRequest {
  string task_id = 1;
}

// Response detailing task lifecycle state and output artifacts.
message GetTaskStatusResponse {
  string task_id = 1;
  TaskState state = 2;
  uint32 active_attempt = 3;
  int32 exit_code = 4;
  bytes stdout_bytes = 5;
  bytes stderr_bytes = 6;
  string error_code = 7;
  string error_message = 8;
  uint64 execution_duration_ms = 9;
}

// Request to list registered worker nodes.
message ListWorkerNodesRequest {}

// Information snapshot for a registered worker node.
message WorkerNodeInfo {
  string node_id = 1;
  NodeCapabilities capabilities = 2;
  string client_version = 3;
  uint64 last_heartbeat_epoch_seconds = 4;
}

// Response containing all registered worker nodes.
message ListWorkerNodesResponse {
  repeated WorkerNodeInfo nodes = 1;
}

// Request to cancel a scheduled or running task.
message CancelTaskRequest {
  string task_id = 1;
}

// Response acknowledging task cancellation.
message CancelTaskResponse {
  bool cancelled = 1;
  string message = 2;
}

// Request to upload or register a WASM bytecode artifact for content-addressed distribution.
// Traces to: [NFR-PERF-001], [NFR-POW-001], [REQ-OP-003]
message UploadArtifactRequest {
  bytes bytecode = 1;
  string expected_sha256 = 2;
}

// Response acknowledging artifact registration.
// Traces to: [NFR-PERF-001], [REQ-OP-003]
message UploadArtifactResponse {
  bool success = 1;
  string artifact_sha256 = 2;
  string artifact_url = 3;
  string message = 4;
}

// Request to generate an ephemeral pairing token.
// Traces to: [INV-002], [NFR-SEC-001], [REQ-OP-001]
message GeneratePairingTokenRequest {
  string node_id = 1;
  uint32 expires_in_seconds = 2;
  string san = 3;
}

// Response containing ephemeral pairing token and enrollment metadata.
// Traces to: [INV-002], [NFR-SEC-001], [REQ-OP-001]
message GeneratePairingTokenResponse {
  string pairing_token = 1;
  string cluster_endpoint = 2;
  string ca_fingerprint = 3;
  string node_id = 4;
  uint64 expires_at_epoch_seconds = 5;
  string pairing_payload_json = 6;
}

// Request to redeem pairing token and sign client CSR.
// Traces to: [INV-002], [NFR-SEC-001], [REQ-OP-001]
message EnrollWorkerRequest {
  string pairing_token = 1;
  string node_id = 2;
  string csr_pem = 3;
}

// Response returning signed X.509 client certificate and Root CA.
// Traces to: [INV-002], [NFR-SEC-001], [REQ-OP-001]
message EnrollWorkerResponse {
  bool success = 1;
  string client_cert_pem = 2;
  string ca_cert_pem = 3;
  string error_message = 4;
}

// Request to list compute tasks and their lifecycle execution states.
// Traces to: [REQ-OP-004], [INV-004], [INV-005]
message ListTasksRequest {
  TaskState state_filter = 1;
}

// Information snapshot for a compute task.
// Traces to: [REQ-OP-004], [INV-004], [INV-005]
message TaskInfo {
  string task_id = 1;
  TaskState state = 2;
  ExecutionEngine engine = 3;
  uint32 run_attempt = 4;
  string assigned_node_id = 5;
  uint32 timeout_seconds = 6;
  bool requires_unmetered = 7;
  int32 exit_code = 8;
  uint64 execution_duration_ms = 9;
  string error_message = 10;
  string speculative_node_id = 11;
}

// Response containing compute tasks.
// Traces to: [REQ-OP-004]
message ListTasksResponse {
  repeated TaskInfo tasks = 1;
}

// Request to retrieve a cached WebAssembly artifact by SHA-256 content address over mTLS.
// Traces to: [INV-002], [NFR-PERF-001], [NFR-POW-001], [REQ-OP-003]
message FetchArtifactRequest {
  string artifact_sha256 = 1;
  string node_id = 2;
}

// Response containing the verified WebAssembly bytecode for a requested SHA-256 digest.
// Traces to: [INV-002], [NFR-PERF-001], [NFR-POW-001], [REQ-OP-003]
message FetchArtifactResponse {
  bytes wasm_bytecode = 1;
  string artifact_sha256 = 2;
}

// Shared workload template for all partitions in a TaskGroup.
// Inline wasm_bytecode is forbidden; WASM workloads must reference a pre-uploaded artifact_sha256.
// Traces to: [NFR-PERF-001], [INV-006], [ANTI-003]
message TaskTemplate {
  ExecutionEngine engine = 1;
  uint32 timeout_seconds = 2;
  string entrypoint = 3;
  map<string, string> env_vars = 4;
  string artifact_sha256 = 5;
  string shell_command = 6;
  bool requires_unmetered = 7;
}

// Per-partition environment overrides within a TaskGroup.
message TaskPartitionSpec {
  map<string, string> env_overrides = 1;
}

// Specification for creating a new TaskGroup.
// Traces to: [REQ-OP-004], [INV-004], [NFR-PERF-001]
message TaskGroupSpec {
  string group_id = 1;
  TaskTemplate template = 2;
  repeated TaskPartitionSpec partitions = 3;
}

// Request to submit a new TaskGroup.
message SubmitTaskGroupRequest {
  TaskGroupSpec group = 1;
}

// Response acknowledging TaskGroup admission.
message SubmitTaskGroupResponse {
  bool accepted = 1;
  string group_id = 2;
  uint64 group_epoch = 3;
  uint32 total_tasks = 4;
  string message = 5;
}

// Request to atomically replace a TaskGroup workload with a new epoch.
// Traces to: [INV-004], [NFR-REL-001]
message ReplaceTaskGroupRequest {
  string group_id = 1;
  optional uint64 expected_epoch = 2;
  TaskTemplate template = 3;
  repeated TaskPartitionSpec partitions = 4;
  ReplaceStrategy strategy = 5;
}

// Response acknowledging atomic TaskGroup replacement.
message ReplaceTaskGroupResponse {
  bool accepted = 1;
  string group_id = 2;
  uint64 new_epoch = 3;
  TaskGroupState state = 4;
  uint32 cancelled_tasks = 5;
  uint32 draining_tasks = 6;
  uint32 created_tasks = 7;
  string message = 8;
}

// Request to cancel an active or draining TaskGroup.
message CancelTaskGroupRequest {
  string group_id = 1;
  optional uint64 expected_epoch = 2;
}

// Response acknowledging TaskGroup cancellation.
message CancelTaskGroupResponse {
  bool cancelled = 1;
  string group_id = 2;
  uint64 epoch = 3;
  uint32 cancelled_tasks = 4;
  string message = 5;
}

// Request for aggregate status of a TaskGroup.
message GetTaskGroupStatusRequest {
  string group_id = 1;
  bool include_tasks = 2;
}

// Aggregate status and partition counters for a TaskGroup.
// Traces to: [REQ-OP-004], [NFR-PERF-001]
message GetTaskGroupStatusResponse {
  string group_id = 1;
  uint64 current_epoch = 2;
  TaskGroupState state = 3;
  uint32 total_tasks = 4;
  uint32 pending_tasks = 5;
  uint32 leased_tasks = 6;
  uint32 running_tasks = 7;
  uint32 completed_tasks = 8;
  uint32 failed_tasks = 9;
  uint32 timed_out_tasks = 10;
  uint32 cancelled_tasks = 11;
  uint32 preempted_tasks = 12;
  uint32 previous_epoch_draining_tasks = 13;
  repeated TaskInfo tasks = 14;
}

// Summary snapshot for a registered TaskGroup.
message TaskGroupSummary {
  string group_id = 1;
  uint64 current_epoch = 2;
  TaskGroupState state = 3;
  uint32 total_tasks = 4;
  uint32 completed_tasks = 5;
  uint32 failed_tasks = 6;
  uint32 cancelled_tasks = 7;
}

// Request to list registered TaskGroups.
message ListTaskGroupsRequest {
  TaskGroupState state_filter = 1;
}

// Response containing TaskGroup summaries.
message ListTaskGroupsResponse {
  repeated TaskGroupSummary groups = 1;
}


